name: Run scan and export results

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to crawl
        required: true
        default: example.com
      search_name:
        description: Optional display name for the scan
        required: false
        default: ""

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for Chromium and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scan and export CSV
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
          SEARCH_NAME: ${{ github.event.inputs.search_name }}
        run: |
          python scripts/run_and_export.py --domain "$DOMAIN" --search-name "$SEARCH_NAME" --output artifacts/results.csv

      - name: Upload exported results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: artifacts/results.csv
