services:
  app:
    build: .
    image: mailcrawl
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # Each scan drives its own Chromium, so the browser — not the event loop —
      # is what caps this. Raise it only alongside the memory limit below.
      MAX_CONCURRENT_SCANS: "${MAX_CONCURRENT_SCANS:-2}"
      # On by default here, unlike a local checkout: a published port serving
      # harvested contact data should never be anonymous. The server refuses to
      # start if these two are empty, so this fails loudly rather than silently
      # coming up unprotected.
      MAILCRAWL_AUTH_ENABLED: "${MAILCRAWL_AUTH_ENABLED:-true}"
      MAILCRAWL_USER: "${MAILCRAWL_USER:?set MAILCRAWL_USER in .env}"
      MAILCRAWL_PASSWORD: "${MAILCRAWL_PASSWORD:?set MAILCRAWL_PASSWORD in .env}"
    volumes:
      # Scan log, saved results and checkpoints. Without this, an interrupted scan
      # is unresumable after a container restart.
      - scan-data:/data
    restart: unless-stopped
    # Chromium needs more than Docker's default 64MB of shared memory or it will
    # crash on content-heavy pages.
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # A scan checkpoints itself on SIGTERM; give it room to finish rather than
    # losing the crawl to Docker's 10s default.
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  scan-data:
